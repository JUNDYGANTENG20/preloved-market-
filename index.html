<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Kosspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0A6C5E; /* Warna hijau teal sesuai gambar */
            --primary-hover: #085348;
            --text-dark: #1A1A1A;
            --text-gray: #666666;
            --bg-light: #F9FAFB;
            --border-color: #E5E7EB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header / Navbar Styling (Disamakan dengan gambar) */
        header {
            background-color: white;
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .auth-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-outline:hover {
            background-color: #F0FDF4;
        }

        .btn-solid {
            background-color: var(--primary-color);
            color: white;
            border: 2px solid var(--primary-color);
        }

        .btn-solid:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        /* Register Section */
        .register-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem 1rem;
        }

        .register-card {
            background-color: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }

        .register-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .register-card p {
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            margin-top: 1rem;
            font-size: 1rem;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-links {
                display: none; /* Menyembunyikan menu di mobile agar rapi */
            }
            header {
                padding: 1rem 5%;
            }
        }
    </style>
</head>
<body>

    <!-- Header disamakan dengan referensi gambar -->
    <header>
        <a href="#" class="logo">Kosspace</a>
        
        <nav class="nav-links">
            <a href="#">Beranda</a>
            <a href="#">Katalog</a>
            <a href="#">Cara Kerja</a>
            <a href="#">Kontak</a>
        </nav>

        <div class="auth-buttons">
            <a href="#" class="btn btn-outline">Masuk</a>
            <a href="#" class="btn btn-solid">Daftar</a>
        </div>
    </header>

    <!-- Form Registrasi -->
    <main class="register-container">
        <div class="register-card">
            <h1>Daftar Akun Baru</h1>
            <p>Bergabunglah dan temukan barang kos murah sekarang.</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Masukkan nama lengkap Anda" required>
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" placeholder="contoh@mahasiswa.ac.id" required>
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" placeholder="Buat kata sandi (min. 8 karakter)" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Konfirmasi Kata Sandi</label>
                    <input type="password" id="confirm-password" placeholder="Ulangi kata sandi" required>
                </div>

                <button type="submit" class="btn btn-solid btn-submit">Daftar Sekarang</button>
            </form>

            <div class="login-link">
                Sudah punya akun? <a href="#">Masuk di sini</a>
            </div>
        </div>
    </main>

</body>
</html>
