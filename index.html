<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Kosspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <a href="#" class="logo">Kosspace</a>
        
        <nav class="nav-links">
            <a href="#">Beranda</a>
            <a href="#">Katalog</a>
            <a href="#">Cara Kerja</a>
            <a href="#">Kontak</a>
        </nav>

        <div class="auth-buttons">
            <a href="#" class="btn btn-outline">Masuk</a>
            <a href="#" class="btn btn-solid">Daftar</a>
        </div>
    </header>

    <!-- Form Registrasi -->
    <main class="register-container">
        <div class="register-card">
            <h1>Daftar Akun Baru</h1>
            <p>Bergabunglah dan temukan barang kos murah sekarang.</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Masukkan nama lengkap Anda" required>
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" placeholder="contoh@mahasiswa.ac.id" required>
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" placeholder="Buat kata sandi (min. 8 karakter)" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Konfirmasi Kata Sandi</label>
                    <input type="password" id="confirm-password" placeholder="Ulangi kata sandi" required>
                </div>

                <button type="submit" class="btn btn-solid btn-submit">Daftar Sekarang</button>
            </form>

            <div class="login-link">
                Sudah punya akun? <a href="#">Masuk di sini</a>
            </div>
        </div>
    </main>

</body>
</html>
